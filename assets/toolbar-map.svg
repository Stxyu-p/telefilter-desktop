<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131a"/>
      <stop offset="100%" stop-color="#141a23"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c222b"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blueActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.22)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.12)"/>
    </linearGradient>
    <linearGradient id="dlBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.08)"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Frame -->
  <rect x="8" y="8" width="944" height="304" rx="16" fill="url(#bgGrad)" stroke="#26303d" stroke-width="1.2"/>
  
  <!-- Telegram WebK Topbar Context -->
  <rect x="28" y="24" width="904" height="42" rx="21" fill="#171e27" stroke="#252f3d" stroke-width="1"/>
  <!-- Avatar -->
  <circle cx="52" cy="45" r="14" fill="#0284c7"/>
  <text x="52" y="49.5" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">M</text>
  <!-- Chat Title & Subtitle -->
  <text x="76" y="41" fill="#f1f5f9" font-size="12.5" font-weight="600">Media Vault</text>
  <text x="76" y="54" fill="#64748b" font-size="9.5" font-weight="400">1 member · private cloud channel</text>
  <!-- Topbar Icons -->
  <circle cx="860" cy="45" r="11" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M856 45a4 4 0 0 0 8 0" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <circle cx="886" cy="43" r="4.5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="889.5" y1="46.5" x2="894" y2="51" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="914" cy="45" r="1.5" fill="#64748b"/>
  <circle cx="914" cy="40" r="1.5" fill="#64748b"/>
  <circle cx="914" cy="50" r="1.5" fill="#64748b"/>

  <!-- ═══ TELEFILTER INLINE TOOLBAR ═══ -->
  <g transform="translate(28, 76)">
    <!-- Main Toolbar Container (34px height) -->
    <rect x="0" y="0" width="904" height="40" rx="8" fill="url(#barGrad)" stroke="#2b3543" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- LEFT: Filter Group (Pills) -->
    <!-- Pill: All (Active) -->
    <rect x="6" y="6" width="46" height="28" rx="5" fill="url(#blueActive)" stroke="#38bdf8" stroke-width="1"/>
    <text x="29" y="24" fill="#38bdf8" font-size="11.5" font-weight="650" text-anchor="middle">All</text>

    <!-- Pill: Text -->
    <rect x="56" y="6" width="62" height="28" rx="5" fill="transparent" stroke="transparent"/>
    <path d="M66 16h10 M66 20h10 M66 24h6" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
    <text x="82" y="24" fill="#94a3b8" font-size="11.5" font-weight="500">Text</text>

    <!-- Pill: Photos -->
    <rect x="122" y="6" width="84" height="28" rx="5" fill="transparent" stroke="transparent"/>
    <rect x="130" y="14" width="13" height="11" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
    <circle cx="134" cy="17.5" r="1" fill="#94a3b8"/>
    <path d="M130 23l3.5-3 2.5 2 3-3 4 4" stroke="#94a3b8" stroke-width="1" fill="none"/>
    <text x="148" y="24" fill="#94a3b8" font-size="11.5" font-weight="500">Photos</text>
    <rect x="189" y="12" width="12" height="14" rx="7" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="195" y="23" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">2</text>

    <!-- Pill: Videos -->
    <rect x="210" y="6" width="82" height="28" rx="5" fill="transparent" stroke="transparent"/>
    <rect x="218" y="14" width="13" height="11" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
    <polygon points="223,17 228,19.5 223,22" fill="#94a3b8"/>
    <text x="236" y="24" fill="#94a3b8" font-size="11.5" font-weight="500">Videos</text>
    <rect x="276" y="12" width="12" height="14" rx="7" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="282" y="23" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">1</text>

    <!-- Pill: Files -->
    <rect x="296" y="6" width="58" height="28" rx="5" fill="transparent" stroke="transparent"/>
    <path d="M305 13h6l3 3v8h-9z" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="319" y="24" fill="#94a3b8" font-size="11.5" font-weight="500">Files</text>

    <!-- Pill: Viral -->
    <rect x="358" y="6" width="58" height="28" rx="5" fill="transparent" stroke="transparent"/>
    <polygon points="368,14 370,19 375,19 371,22 372.5,27 368,24 363.5,27 365,22 361,19 366,19" fill="none" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="379" y="24" fill="#94a3b8" font-size="11.5" font-weight="500">Viral</text>

    <!-- Divider Line -->
    <line x1="432" y1="11" x2="432" y2="29" stroke="#2b3543" stroke-width="1"/>

    <!-- RIGHT: Action Controls -->
    <!-- Split Download Action -->
    <g transform="translate(628, 6)">
      <!-- Main Download Button -->
      <path d="M5 0 h97 v28 h-97 a5 5 0 0 1 -5 -5 v-18 a5 5 0 0 1 5 -5 z" fill="url(#dlBtnGrad)" stroke="#38bdf8" stroke-width="1"/>
      <path d="M12 16l4 4 4-4 M16 11v9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="35" y="18" fill="#38bdf8" font-size="11.5" font-weight="600">Download</text>
      
      <!-- Dropdown Chevron Trigger -->
      <path d="M102 0 h18 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-18 z" fill="url(#dlBtnGrad)" stroke="#38bdf8" stroke-width="1"/>
      <path d="M111 12l3.5 4 3.5-4" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Library Action -->
    <g transform="translate(762, 6)">
      <rect x="0" y="0" width="82" height="28" rx="5" fill="#1a212b" stroke="#2b3543" stroke-width="1"/>
      <path d="M10 13h9a2 2 0 0 1 2 2v10l-6.5-3-6.5 3V15a2 2 0 0 1 2-2z" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="27" y="18" fill="#cbd5e1" font-size="11.5" font-weight="550">Library</text>
      <rect x="67" y="6" width="10" height="13" rx="5" fill="#38bdf8"/>
      <text x="72" y="16" fill="#0f172a" font-size="8.5" font-weight="750" text-anchor="middle">1</text>
    </g>

    <!-- More Options Menu -->
    <g transform="translate(852, 6)">
      <rect x="0" y="0" width="28" height="28" rx="5" fill="#1a212b" stroke="#2b3543" stroke-width="1"/>
      <circle cx="8" cy="14" r="1.4" fill="#cbd5e1"/>
      <circle cx="14" cy="14" r="1.4" fill="#cbd5e1"/>
      <circle cx="20" cy="14" r="1.4" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- ═══ CALLOUT ANNOTATION CARDS (English) ═══ -->
  <g transform="translate(28, 140)">
    <!-- Connecting Guides -->
    <path d="M120 0 v20 q0 12 12 12 h20" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <path d="M380 0 v20 q0 12 -12 12 h-20" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <path d="M690 0 v20 q0 12 12 12 h20" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
    <path d="M840 0 v20 q0 12 -12 12 h-20" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

    <!-- Card 1: Instant Media Filters -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="214" height="110" rx="10" fill="#131922" stroke="#252f3d" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
      <text x="26" y="30" fill="#38bdf8" font-size="14" text-anchor="middle">🎛️</text>
      <text x="48" y="24" fill="#f8fafc" font-size="12" font-weight="650">Instant Filters</text>
      <text x="48" y="37" fill="#64748b" font-size="10">Zero-Reload CSS Engine</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10.5" font-weight="400">• Filter photos, videos &amp; docs</text>
      <text x="12" y="76" fill="#94a3b8" font-size="10.5" font-weight="400">• Live chat-wide item counters</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10.5" font-weight="400">• Double-click for batch download</text>
    </g>

    <!-- Card 2: Split Download Engine -->
    <g transform="translate(230, 36)">
      <rect x="0" y="0" width="214" height="110" rx="10" fill="#131922" stroke="#252f3d" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(245, 158, 11, 0.12)"/>
      <text x="26" y="30" fill="#f59e0b" font-size="14" text-anchor="middle">📦</text>
      <text x="48" y="24" fill="#f8fafc" font-size="12" font-weight="650">Split Downloader</text>
      <text x="48" y="37" fill="#64748b" font-size="10">Native Stream &amp; ZIP32</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10.5" font-weight="400">• 1-Click native Telegram stream</text>
      <text x="12" y="76" fill="#94a3b8" font-size="10.5" font-weight="400">• Toggle ▾ for direct .zip bundle</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10.5" font-weight="400">• Unpacks mixed photo/video albums</text>
    </g>

    <!-- Card 3: Bookmark Library -->
    <g transform="translate(460, 36)">
      <rect x="0" y="0" width="214" height="110" rx="10" fill="#131922" stroke="#252f3d" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(168, 85, 247, 0.12)"/>
      <text x="26" y="30" fill="#c084fc" font-size="14" text-anchor="middle">🔖</text>
      <text x="48" y="24" fill="#f8fafc" font-size="12" font-weight="650">Workspace Library</text>
      <text x="48" y="37" fill="#64748b" font-size="10">IndexedDB Message Vault</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10.5" font-weight="400">• Pin critical messages &amp; media</text>
      <text x="12" y="76" fill="#94a3b8" font-size="10.5" font-weight="400">• Custom tag &amp; search filters</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10.5" font-weight="400">• Instant jump to message origin</text>
    </g>

    <!-- Card 4: Tools & Precision Harvester -->
    <g transform="translate(690, 36)">
      <rect x="0" y="0" width="214" height="110" rx="10" fill="#131922" stroke="#252f3d" stroke-width="1"/>
      <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(16, 185, 129, 0.12)"/>
      <text x="26" y="30" fill="#34d399" font-size="14" text-anchor="middle">⚡</text>
      <text x="48" y="24" fill="#f8fafc" font-size="12" font-weight="650">Deep Harvester</text>
      <text x="48" y="37" fill="#64748b" font-size="10">DOM Virtualization Bypass</text>
      <text x="12" y="60" fill="#94a3b8" font-size="10.5" font-weight="400">• Auto-scroll &amp; index chat history</text>
      <text x="12" y="76" fill="#94a3b8" font-size="10.5" font-weight="400">• Download logs &amp; retry queue</text>
      <text x="12" y="92" fill="#94a3b8" font-size="10.5" font-weight="400">• Smart filenames &amp; .txt captions</text>
    </g>
  </g>
</svg>
